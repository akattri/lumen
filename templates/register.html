{% extends "base.html" %}

{% block title %}Create Account — Calalog{% endblock %}

{% block content %}
<div class="site-container">
  <div class="auth-wrapper">
    <div class="auth-header">
      <div class="auth-logo">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
      <h1 class="auth-title">CALALOG</h1>
      <p class="auth-subtitle">Pick up where you left off</p>
    </div>

    <!-- Tab switch -->
    <div style="display:flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px;">
      <a href="{{ url_for('views.login_page') }}" style="flex:1; text-align:center; padding-bottom:10px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; border-bottom: 2px solid transparent; color:var(--text-subtle);">
        Log In
      </a>
      <a href="{{ url_for('views.register_page') }}" style="flex:1; text-align:center; padding-bottom:10px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; border-bottom: 2px solid #FFFFFF; color:#FFFFFF;">
        Create Account
      </a>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username (min 2 chars)" value="{{ username or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Choose a password (min 4 chars)" required>
      </div>

      <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:10px; margin-top:8px;">
        <span>Create Account</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7.5" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a href="{{ url_for('views.login_page') }}">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
