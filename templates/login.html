{% extends "base.html" %}

{% block title %}Log In — Calalog{% endblock %}

{% block content %}
<div class="site-container">
  <div class="auth-wrapper">
    <div class="auth-header">
      <div class="auth-logo">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
      <h1 class="auth-title">CALALOG</h1>
      <p class="auth-subtitle">Pick up where you left off</p>
    </div>

    <!-- Tab switch -->
    <div style="display:flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px;">
      <a href="{{ url_for('views.login_page') }}" style="flex:1; text-align:center; padding-bottom:10px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; border-bottom: 2px solid #FFFFFF; color:#FFFFFF;">
        Log In
      </a>
      <a href="{{ url_for('views.register_page') }}" style="flex:1; text-align:center; padding-bottom:10px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; border-bottom: 2px solid transparent; color:var(--text-subtle);">
        Create Account
      </a>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. alex" value="{{ username or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:10px; margin-top:8px;">
        <span>Log In</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>

    <div class="auth-footer">
      <span>Don't have an account yet?</span>
      <a href="{{ url_for('views.register_page') }}">Create one</a>
    </div>
  </div>
</div>
{% endblock %}
